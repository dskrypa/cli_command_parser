# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
name: Test Build
permissions: read-all  # Declare default permissions as read only.
on:
  push:
    branches: ["main"]
    paths: ["lib/**", "tests/**"]
  pull_request:
    branches: ["main"]
    paths: ["lib/**", "tests/**", ".github/workflows/*.yml"]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ["ubuntu-latest"]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Add test locales
        # This is required for testing locale-specific date/time inputs
        run: |
          sudo apt-get update
          sudo apt install locales -y
          sudo locale-gen en_US.UTF-8 fr_FR.UTF-8 ko_KR.UTF-8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .[wcwidth,dev]
      - name: Lint with ruff
        run: ruff check
      - name: Generate coverage report
        run: pytest --cov-branch --cov=./lib/ --cov-report=xml
      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage/reports/
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          verbose: true
